spring:
  application:
    name: campus-agent-backend

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  api-version: v1
  data-directory: ${APP_DATA_DIRECTORY:./backend-data}
  model:
    endpoint: ${APP_MODEL_ENDPOINT:https://api.deepseek.com/chat/completions}
    name: ${APP_MODEL_NAME:${DEEPSEEK_MODEL:deepseek-flash}}
    api-key: ${APP_MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
    credential-key: ${APP_MODEL_CREDENTIAL_KEY:}
    allowed-endpoints: ${APP_MODEL_ALLOWED_ENDPOINTS:}
  web:
    api-key: ${APP_WEB_API_KEY:${DEEPSEEK_API_KEY:}}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
