services:
  backend:
    build:
      context: ../backend
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: "${SERVER_FORWARD_HEADERS_STRATEGY:-none}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      APP_MODEL_CREDENTIAL_KEY: "${APP_MODEL_CREDENTIAL_KEY:-}"
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
